spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888/

server:
  port: 8084

final-coursework:
  payment:
    success-rate: 0.9

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info